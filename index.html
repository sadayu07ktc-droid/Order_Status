<script>
/* auto version-check: เทียบ ETag ไฟล์บนเซิร์ฟเวอร์กับที่ค้างในแคช
   ถ้าเซิร์ฟเวอร์ใหม่กว่า → รีโหลดตัวเองด้วย ?v= (บัสต์แคช) อัตโนมัติ
   ไม่ต้องล้างแคชเอง / ไม่ต้อง bump เลขเวอร์ชันเอง / กันลูปด้วย localStorage */
(function(){
  try {
    var LS = 'ssb_htmlver';
    fetch(location.pathname + '?_cc=' + Date.now(), { cache: 'no-store', method: 'HEAD' })
      .then(function(r){
        var tag = r.headers.get('ETag') || r.headers.get('Last-Modified') || '';
        if (!tag) return;
        var seen = null; try { seen = localStorage.getItem(LS); } catch(e){}
        try { localStorage.setItem(LS, tag); } catch(e){}
        if (seen && seen !== tag) {
          var u = new URL(location.href);
          u.searchParams.set('v', tag.replace(/[^A-Za-z0-9]/g, ''));  // เก็บ uid/param เดิมไว้
          location.replace(u.toString());
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>

function flowStepsFor(order) {
  if (!order || !order.hasRamp) return FLOW_STEPS;
  const out = [];
  FLOW_STEPS.forEach(function (s) {
    out.push(s);
    if (s.key === "เริ่มงานแล้ว") out.push({ key: "ถึงลานวางกระบะ", label: "แวะวางกระบะ", icon: "warehouse" });

  });
  return out;
}

    case "done":    return "bg-emerald-50 border-emerald-200 text-emerald-900";
    case "danger":  return "bg-[#FCEBEB] border-[#F09595] text-[#791F1F]";
    case "warning": return "bg-[#FAEEDA] border-[#EF9F27] text-[#633806]";
    default:        return "bg-amber-50 border-amber-200 text-amber-900";
  }
}

function statusBadgeHtml(status) {
  const exception = EXCEPTION_STATUSES[status];
  if (exception) {
    return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${toneClasses(exception.tone)}">${icon(exception.icon, 13)}${exception.label}</span>`;
  }
  const idx = FLOW_STEPS.findIndex(s => s.key === status);
  const isDone = idx === FLOW_STEPS.length - 1;
  const isStart = idx <= 0;
  const cls = isDone ? "bg-emerald-100 text-emerald-800 border-emerald-300"
            : isStart ? "bg-amber-50 text-amber-800 border-amber-300"
            : "bg-amber-100 text-amber-900 border-amber-400";
  const label = FLOW_STEPS[idx] ? FLOW_STEPS[idx].label : status;
  return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${cls}">${icon(isDone ? "check" : "clock", 13)}${label}</span>`;
}

function customerStatusBadgeHtml(rawStatus) {
  const custStatus = toCustomerStatus(rawStatus);
  if (custStatus === "ยกเลิก") {
    return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${toneClasses("danger")}">${icon("x", 13)}ยกเลิก</span>`;
  }
  const idx = CUSTOMER_FLOW_STEPS.findIndex(s => s.key === custStatus);
  const isDone = idx === CUSTOMER_FLOW_STEPS.length - 1;
  const isStart = idx <= 0;
  const cls = isDone ? "bg-emerald-100 text-emerald-800 border-emerald-300"
            : isStart ? "bg-amber-50 text-amber-800 border-amber-300"
            : "bg-amber-100 text-amber-900 border-amber-400";
  const label = CUSTOMER_FLOW_STEPS[idx] ? CUSTOMER_FLOW_STEPS[idx].label : custStatus;
  return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${cls}">${icon(isDone ? "check" : "clock", 13)}${label}</span>`;
}

function checkinLabel(source) {
  // ป้าย "ถึงลูกค้า" ให้ตรงที่มาจริง: GPS อัตโนมัติ / คนขับกดเอง / ไม่ทราบ
  const s = String(source || '');
  if (s.indexOf('GPS') !== -1) return 'ถึงลูกค้า (GPS)';
  if (s.trim()) return 'ถึงลูกค้า (กดเอง)';
  return 'ถึงลูกค้า';   // ไม่ทราบที่มา → ไม่เคลม GPS
}

// cancel_reason = "ยกเลิกโดย<ใคร> — <เหตุผล>" (order-actions) → แยกแสดง โดย / เหตุผล
function cancelReasonHtml(cr) {
  cr = String(cr || '').trim(); if (!cr) return '';
  const m = cr.match(/^ยกเลิกโดย(.*?)(?:\s+—\s+(.+))?$/);
  const line = (k, v) => `<span class="block font-normal mt-0.5 opacity-90">${k}: ${escapeHtml(v)}</span>`;
  if (!m) return line('เหตุผล', cr);
  return line('โดย', m[1] || '—') + (m[2] ? line('เหตุผล', m[2]) : '');
}
function timelineHtml(status, timestamps, steps, cancelReason, checkinSource, cancelReq) {
  timestamps = timestamps || {};
  const isCancelled = status === "ยกเลิก";
  const exception = EXCEPTION_STATUSES[status];
  let currentIdx = steps.findIndex(s => s.key === status);
  const effectiveIdx = currentIdx === -1 ? 0 : currentIdx;

  let stepsHtml = steps.map((step, idx) => {
    const done = idx <= effectiveIdx && currentIdx !== -1;
    const isLast = idx === steps.length - 1;
    const ts = timestamps[step.key];
    const label = (step.key === 'ถึงลูกค้า') ? checkinLabel(checkinSource) : step.label;
    const circleCls = done ? "bg-emerald-600 border-emerald-600 text-white" : "bg-white border-amber-200 text-amber-400";
    const labelCls  = done ? "text-emerald-800" : "text-amber-700/60";
    const connectorCls = (idx < effectiveIdx && currentIdx !== -1) ? "bg-emerald-500" : "bg-amber-200";
    return `
      <div class="flex items-start min-w-fit">
        <div class="flex flex-col items-center gap-1.5">
          <div class="flex items-center justify-center w-9 h-9 rounded-full border-2 transition-colors ${circleCls}">${icon(step.icon, 16)}</div>
          <span class="text-[11px] font-medium text-center w-20 leading-tight ${labelCls}">${label}</span>
          <span class="text-[10px] text-amber-600/70 text-center w-20 leading-tight tabular-nums">${ts || "—"}</span>
        </div>
        ${!isLast ? `<div class="h-0.5 w-10 sm:w-16 mx-1 mt-[18px] rounded transition-colors ${connectorCls}"></div>` : ''}
      </div>`;
  }).join('');

  let footerHtml = '';
  if (isCancelled) {
    footerHtml = `
      <div class="flex items-start gap-2 text-xs font-medium px-3 py-2 rounded-xl border ${toneClasses("danger")}">
        ${icon("x", 14, "mt-0.5 shrink-0")}
        <span>ออเดอร์นี้ถูกยกเลิกแล้ว${cancelReasonHtml(cancelReason)}</span>
      </div>`;
  } else if (exception) {
    const msg = exception.label === "ถึงลานเท" ? "คนขับแวะลานเทก่อนไปจุดต่อไป" : cancelReq ? "คนขับขอยกเลิกงาน — รอแอดมินตัดสิน" : "งานนี้ต้องการความช่วยเหลือจาก Admin";
    footerHtml = `
      <div class="flex items-center gap-2 text-xs font-medium px-3 py-2 rounded-xl border ${toneClasses(exception.tone)}">
        ${icon(exception.icon, 14)}${msg}
      </div>`;
  }

  return `
    <div class="space-y-2">
      <div class="flex items-start w-full overflow-x-auto pb-2 scrollbar-thin">${stepsHtml}</div>
      ${footerHtml}
    </div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── 🔔 Toast + Modal ธีมเดียวกับระบบ (แทน alert()/confirm() โบราณ) ──
function toast(msg, type) {
  let wrap = document.getElementById('ssbToastWrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'ssbToastWrap'; wrap.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 items-center pointer-events-none'; document.body.appendChild(wrap); }
  const bad = type === 'error' || /❌|ไม่สำเร็จ|ผิดพลาด|ข้อผิดพลาด|ไม่พบ|error/i.test(String(msg || ''));
  const t = document.createElement('div');
  t.className = (bad ? 'bg-red-600' : 'bg-emerald-700') + ' text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg max-w-[90vw] whitespace-pre-line text-center opacity-0 transition-opacity duration-200';
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; });
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3400);
}
// กล่องถามพร้อมช่องพิมพ์ (เหตุผลไม่บังคับ) → string (ว่างได้) | null = กดยกเลิก · 11 พ.ย. ใช้ตอนปฏิเสธคำขอยกเลิก
function promptModal(opt) {
  opt = opt || {};
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'fixed inset-0 z-[121] flex items-center justify-center bg-black/40 p-4';
    ov.innerHTML =
      '<div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-3" role="dialog" aria-modal="true">' +
        '<div class="flex items-start gap-3">' +
          '<div class="text-2xl leading-none">' + (opt.icon || '✍️') + '</div>' +
          '<div class="flex-1 min-w-0"><p class="font-bold text-emerald-900">' + escapeHtml(opt.title || '') + '</p>' +
          (opt.msg ? '<p class="text-sm text-emerald-800/80 mt-1 whitespace-pre-line">' + escapeHtml(opt.msg) + '</p>' : '') + '</div>' +
        '</div>' +
        '<textarea data-in rows="2" maxlength="200" class="w-full px-3 py-2 rounded-xl border border-amber-200 text-sm focus:outline-none focus:border-emerald-400" placeholder="' + escapeHtml(opt.placeholder || '') + '"></textarea>' +
        '<div class="flex gap-2 justify-end pt-1">' +
          '<button data-x class="px-4 py-2 rounded-xl text-sm font-medium text-emerald-800 bg-amber-50 hover:bg-amber-100 border border-amber-200">' + escapeHtml(opt.cancelText || 'ยกเลิก') + '</button>' +
          '<button data-ok class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-emerald-700 hover:bg-emerald-800">' + escapeHtml(opt.okText || 'ยืนยัน') + '</button>' +
        '</div></div>';
    const inp = ov.querySelector('[data-in]');
    const done = v => { ov.remove(); document.removeEventListener('keydown', onkey); resolve(v); };
    const onkey = e => { if (e.key === 'Escape') done(null); };
    ov.querySelector('[data-ok]').onclick = () => done(inp.value.trim());
    ov.querySelector('[data-x]').onclick = () => done(null);
    ov.onclick = e => { if (e.target === ov) done(null); };
    document.addEventListener('keydown', onkey);
    document.body.appendChild(ov);
    inp.focus();
  });
}
function confirmModal(opt) {
  opt = opt || {};
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'fixed inset-0 z-[121] flex items-center justify-center bg-black/40 p-4';
    ov.innerHTML =
      '<div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-3" role="dialog" aria-modal="true">' +
        '<div class="flex items-start gap-3">' +
          '<div class="text-2xl leading-none">' + (opt.icon || '❓') + '</div>' +
          '<div class="flex-1 min-w-0"><p class="font-bold text-emerald-900">' + escapeHtml(opt.title || 'ยืนยัน?') + '</p>' +
          (opt.msg ? '<p class="text-sm text-emerald-800/80 mt-1 whitespace-pre-line">' + escapeHtml(opt.msg) + '</p>' : '') + '</div>' +
        '</div>' +
        '<div class="flex gap-2 justify-end pt-1">' +
          '<button data-x class="px-4 py-2 rounded-xl text-sm font-medium text-emerald-800 bg-amber-50 hover:bg-amber-100 border border-amber-200">' + escapeHtml(opt.cancelText || 'ยกเลิก') + '</button>' +
          '<button data-ok class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-emerald-700 hover:bg-emerald-800">' + escapeHtml(opt.okText || 'ยืนยัน') + '</button>' +
        '</div></div>';
    const done = v => { ov.remove(); document.removeEventListener('keydown', onkey); resolve(v); };
    const onkey = e => { if (e.key === 'Escape') done(false); else if (e.key === 'Enter') done(true); };
    ov.querySelector('[data-ok]').onclick = () => done(true);
    ov.querySelector('[data-x]').onclick = () => done(false);
    ov.onclick = e => { if (e.target === ov) done(false); };
    document.addEventListener('keydown', onkey);
    document.body.appendChild(ov);
    ov.querySelector('[data-ok]').focus();
  });
}

// 🚫 เลือกเหตุผลยกเลิก (2026-10-21) → string | null · บังคับมีเหตุผล · "อื่นๆ" ต้องพิมพ์เอง
const CANCEL_REASONS = ['ปาล์มยังไม่พร้อม / ตัดไม่ทัน', 'เปลี่ยนวัน-เวลา (จะสั่งใหม่)', 'สั่งซ้ำ / สั่งผิด', 'ฝนตก / รถเข้าสวนไม่ได้', 'ไม่มีคนขับรับงาน', 'หารถเองได้แล้ว'];
const CANCEL_REASONS_ADMIN = ['ไม่มีรถว่าง', 'สวน/ทีมตัดแจ้งยกเลิก'];
function cancelReasonModal(opt) {
  opt = opt || {};
  const list = (CURRENT_ROLE === 'Admin' ? CANCEL_REASONS_ADMIN : []).concat(CANCEL_REASONS, ['อื่นๆ (ระบุเอง)']);
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'fixed inset-0 z-[121] flex items-center justify-center bg-black/40 p-4';
    ov.innerHTML =
      '<div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="cr-t">' +
        '<div class="flex items-start gap-3"><div class="text-2xl leading-none">🚫</div><div class="flex-1 min-w-0">' +
          '<p id="cr-t" class="font-bold text-emerald-900">ยกเลิกออเดอร์นี้?</p>' +
          (opt.msg ? '<p class="text-sm text-emerald-800/80 mt-1 whitespace-pre-line">' + escapeHtml(opt.msg) + '</p>' : '') + '</div></div>' +
        '<p class="text-sm font-semibold text-emerald-900">เหตุผล <span class="text-rose-600 text-xs font-medium">* จำเป็น</span></p>' +
        '<div class="flex flex-wrap gap-2" role="radiogroup" aria-label="เหตุผลที่ยกเลิก">' +
          list.map((r, i) => '<button type="button" role="radio" aria-checked="false" data-r="' + i + '" class="cr-chip px-3 py-1.5 rounded-full text-[13px] border border-amber-200 bg-amber-50 text-emerald-900 hover:bg-amber-100">' + escapeHtml(r) + '</button>').join('') +
        '</div>' +
        '<textarea id="cr-note" rows="2" maxlength="150" class="w-full border border-emerald-200 rounded-xl px-3 py-2 text-sm placeholder:text-emerald-800/35" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ) เช่น เลื่อนไปวันศุกร์"></textarea>' +
        '<p id="cr-err" class="text-xs text-rose-600 hidden"></p>' +
        '<div class="flex gap-2 justify-end pt-1">' +
          '<button data-x class="px-4 py-2 rounded-xl text-sm font-medium text-emerald-800 bg-amber-50 hover:bg-amber-100 border border-amber-200">ไม่ยกเลิก</button>' +
          '<button data-ok class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700">🚫 ยกเลิกออเดอร์</button>' +
        '</div></div>';
    let pick = -1;
    const note = ov.querySelector('#cr-note'), err = ov.querySelector('#cr-err');
    const isOther = () => pick === list.length - 1;
    ov.querySelectorAll('.cr-chip').forEach(b => b.onclick = () => {
      pick = +b.dataset.r;
      ov.querySelectorAll('.cr-chip').forEach(x => {
        const on = x === b; x.setAttribute('aria-checked', String(on));
        x.className = 'cr-chip px-3 py-1.5 rounded-full text-[13px] border ' + (on ? 'border-rose-500 bg-rose-600 text-white font-semibold' : 'border-amber-200 bg-amber-50 text-emerald-900 hover:bg-amber-100');
      });
      note.placeholder = isOther() ? 'พิมพ์เหตุผลที่ยกเลิก' : 'รายละเอียดเพิ่มเติม (ไม่บังคับ) เช่น เลื่อนไปวันศุกร์';
      err.classList.add('hidden');
      if (isOther()) note.focus();
    });
    const done = v => { ov.remove(); document.removeEventListener('keydown', onkey); resolve(v); };
    const onkey = e => { if (e.key === 'Escape') done(null); };
    ov.querySelector('[data-ok]').onclick = () => {
      const extra = note.value.trim();
      if (pick < 0) { err.textContent = 'กรุณาเลือกเหตุผลที่ยกเลิก'; err.classList.remove('hidden'); return; }
      if (isOther() && !extra) { err.textContent = 'กรุณาพิมพ์เหตุผลที่ยกเลิก'; err.classList.remove('hidden'); note.focus(); return; }
      done(isOther() ? extra : list[pick] + (extra ? ' · ' + extra : ''));
    };
    ov.querySelector('[data-x]').onclick = () => done(null);
    ov.onclick = e => { if (e.target === ov) done(null); };
    document.addEventListener('keydown', onkey);
    document.body.appendChild(ov);
    const first = ov.querySelector('.cr-chip'); if (first) first.focus();
  });
}

// 📄 modal ดูใบชั่งน้ำหนัก (ลูกค้า/ลาน/โรงงาน) — เปิดรูปในแท็บใหม่
function openWeighSlips(orderId) {
  const o = (ALL_ORDERS || []).find(x => x.orderId === orderId);
  if (!o || !o.weighSlips || !o.weighSlips.length) { toast('ยังไม่มีใบชั่งครับ'); return; }
  const kg = function (x) { const n = Number(String(x == null ? '' : x).replace(/,/g, '')); return isFinite(n) && n ? n.toLocaleString() : ''; };
  // แปลงลิงก์ Drive → ลิงก์รูปตรงที่ <img> โหลดได้
  const imgUrl = function (u) { u = String(u || ''); const m = u.match(/\/d\/([a-zA-Z0-9_-]+)/) || u.match(/[?&]id=([a-zA-Z0-9_-]+)/); return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : u; };
  const rows = o.weighSlips.map(function (s) {
    const full = String(s.url || '').replace(/"/g, '%22');
    const img  = imgUrl(s.url).replace(/"/g, '%22');
    const h = kg(s.heavy), l = kg(s.light), nt = kg(s.net);
    const lines =
      (h  ? `<div class="flex justify-between text-emerald-700/70"><span>🏋️ รถหนัก</span><span class="tabular-nums">${h} กก.</span></div>` : '') +
      (l  ? `<div class="flex justify-between text-emerald-700/70"><span>🪶 รถเบา</span><span class="tabular-nums">${l} กก.</span></div>` : '') +
      (nt ? `<div class="flex justify-between font-semibold text-emerald-900"><span>✅ สุทธิ</span><span class="tabular-nums">${nt} กก.</span></div>` : '');
    return `<div class="border-t border-amber-100 py-2.5">
      <div class="font-semibold text-emerald-900 mb-1">${escapeHtml(s.label)}</div>
      ${lines ? `<div class="space-y-0.5 text-xs mb-2">${lines}</div>` : ''}
      ${img ? `<a href="${full}" target="_blank" rel="noopener" class="block" title="แตะเพื่อดูรูปเต็ม">
        <img src="${img}" loading="lazy" referrerpolicy="no-referrer" alt="ใบชั่ง ${escapeHtml(s.label)}"
          class="w-full rounded-lg border border-amber-200 bg-amber-50"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span class="hidden items-center justify-center gap-1 py-2 text-xs text-emerald-700 underline">📄 โหลดรูปไม่ได้ — แตะเปิดในแท็บใหม่</span>
      </a>` : ''}
    </div>`;
  }).join('');
  const m = o.weighMoney || null;
  const price = m ? Number(String(m.price || '').replace(/,/g, '')) : 0;
  const total = m ? Number(String(m.total || '').replace(/,/g, '')) : 0;
  const hasMoney = (isFinite(price) && price) || (isFinite(total) && total);
  const moneyHtml = !hasMoney ? '' : `
    <div class="border-t-2 border-amber-200 mt-1 pt-2.5 space-y-0.5 text-xs">
      ${isFinite(price) && price ? `<div class="flex justify-between text-emerald-800"><span>💵 ราคา/กก.</span><span class="tabular-nums">${price.toLocaleString(undefined, { minimumFractionDigits: 2 })} บาท</span></div>` : ''}
      ${isFinite(total) && total ? `<div class="flex justify-between font-bold text-emerald-900 text-sm"><span>💰 ยอดรวม</span><span class="tabular-nums">${total.toLocaleString()} บาท</span></div>` : ''}
    </div>`;
  // หัวสรุปออเดอร์ — ให้เหมือนการ์ดที่แจ้งเจ้าของสวนตอนจบงาน
  const sum = `<div class="space-y-0.5 text-xs text-emerald-800 mb-2 pb-2 border-b border-amber-100">
      ${o.gardenName ? `<div>🌳 สวน: <span class="font-medium text-emerald-900">${escapeHtml(o.gardenName)}</span></div>` : ''}
      <div>📋 ชื่อในบิล: <span class="font-medium text-emerald-900">${escapeHtml(o.billName || o.gardenName || '—')}</span></div>
      ${o.date ? `<div>📅 วันที่: ${escapeHtml(fmtDMY(o.date))}${o.time ? ' ' + escapeHtml(o.time) : ''}</div>` : ''}
      ${o.pickup ? `<div>📍 จุดรับ: ${escapeHtml(o.pickup)}</div>` : ''}
      ${o.binCount ? `<div>🧺 กระบะ: ${escapeHtml(String(o.binCount))} ใบ</div>` : ''}
      ${o.driverName ? `<div>👤 คนขับ: ${escapeHtml(o.driverName)}${o.plate ? ` (${escapeHtml(o.plate)})` : ''}</div>` : ''}
    </div>`;
  const ov = document.createElement('div');
  ov.className = 'fixed inset-0 z-[121] flex items-center justify-center bg-black/40 p-4';
  ov.innerHTML = `<div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 max-h-[85vh] overflow-y-auto" role="dialog" aria-modal="true">
    <div class="flex items-center justify-between mb-1"><p class="font-bold text-emerald-900">📄 ใบชั่งน้ำหนัก</p>
      <button data-x class="text-emerald-700 text-2xl leading-none px-1">×</button></div>
    <p class="text-xs text-amber-700/70 mb-2 break-all">${escapeHtml(orderId)}</p>
    ${sum}${rows}${moneyHtml}</div>`;
  const close = () => ov.remove();
  ov.querySelector('[data-x]').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  document.body.appendChild(ov);
}

async function loadPkSlips() {

      (r && r.ok && r.rows || []).forEach(x => { if (x && x.order_id) next[x.order_id] = x; });

    if (data && data.success) {
      EDITING_IDS.delete(orderId);
      setTimeout(() => loadOrders(true), 800); // โหลดใหม่ให้เห็นค่าที่แก้
    } else {
      toast('แก้ไขไม่สำเร็จ: ' + ((data && data.error) || 'ไม่ทราบสาเหตุ'));
      btn.disabled = false; btn.innerHTML = '💾 บันทึก';
    }
  } catch (e) {
    toast('เกิดข้อผิดพลาด: ' + (e.message || e));
    btn.disabled = false; btn.innerHTML = '💾 บันทึก';
  }
}

// 🆕 ยกเลิกออเดอร์ (เจ้าของ/ทีม/ลาน/แอดมิน) — เฉพาะยังไม่เริ่มงาน + ก่อนนัด 2 ชม. → แจ้งแอดมิน
async function cancelOrderGuarded(orderId) {
  const o = (ALL_ORDERS || []).find(x => x.orderId === orderId) || {};
  const reason = await cancelReasonModal({
    msg: `${orderId}${o.gardenName ? ' · ' + o.gardenName : ''}\nระบบจะแจ้ง${o.driverName ? 'คนขับ (' + o.driverName + ') ' : ''}แอดมิน และคนสั่งงาน/สวน พร้อมเหตุผล`
  });
  if (!reason) return;
  try {
    const res = await postAction({ action: 'cancelOrderOwner', userId: window._userId, orderId: orderId, reason: reason });
    const data = await res.json();
    if (data && data.success) {
      toast('🚫 ยกเลิกออเดอร์แล้ว');
      setTimeout(() => loadOrders(true), 800);
    } else {
      toast('ยกเลิกไม่สำเร็จ: ' + ((data && data.error) || 'ไม่ทราบสาเหตุ'));
    }
  } catch (e) {
    toast('เกิดข้อผิดพลาด: ' + (e.message || e));
  }
}

// 📦 รายละเอียดงาน Packing ที่ขอรถไร่ (order.pk จาก Edge order-tracker · ใบ PKR) แทน จุดรับ/จำนวนกระบะ ของงานปาล์ม
function pkDetailHtml(p) {
  const kv = (k, v) => v ? `<span><span class="font-medium text-emerald-900">${k}:</span> ${escapeHtml(v)}</span>` : "";
  return [kv("ใบขอรถ", p.rid), kv("ปลายทาง", p.dest), kv(p.mall ? "งานห้างวันที่" : "วันส่ง", p.dlv), kv("ขึ้นสินค้า", p.loadDay),
    kv("เข้าโหลด", p.load && p.load + " น."), kv("เวลาลงสินค้า", p.unload && p.unload + " น."), kv("จำนวน", p.qty), kv("รถ", p.veh)].join(" ");
}

function orderCardHtml(order, idx, isAdmin) {
  const expanded = EXPANDED_IDS.has(order.orderId);
  const ownerStyle = OWNER_TYPE_STYLES[order.ownerType];
  const custStatus = toCustomerStatus(order.status);

  let chipHtml = '';

    : '';
  const pkSlipHtml = isAdmin ? pkSlipChipHtml(order) : '';

  // ── ปุ่ม "หาคนขับ" — ขึ้นเฉพาะ Admin และออเดอร์ที่ยังไม่มีคนขับ/ต้องการความช่วยเหลือ ──
  const needDriver = isAdmin && ["ไม่มีคนขับรับงาน", "รอคนขับรับงาน", "แจ้งเตือนแอดมิน"].includes(order.status);
  const _assignCls = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-semibold hover:bg-amber-700 transition-colors shrink-0";

  // ใช้ <a> ไม่ใช่ <button> เพราะการ์ดเป็น <button> อยู่แล้ว (ซ้อน button = layout เพี้ยน)
  const assignDriverHtml = !needDriver ? '' : (order.jobType === 'Packing'
    ? `<a href="#" onclick="event.preventDefault(); event.stopPropagation(); openReassign('${escapeHtml(order.orderId)}')" class="${_assignCls}">${icon("user", 14)}หาคนขับ</a>`
    : `<a href="${ASSIGN_DRIVER_URL}?orderId=${encodeURIComponent(order.orderId)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="${_assignCls}">${icon("user", 14)}หาคนขับ</a>`);

  let detailHtml = '';

    if (isAdmin) {

    } else {
      tlHtml = timelineHtml(custStatus, toCustomerTimestamps(order.timestamps), CUSTOMER_FLOW_STEPS, order.cancelReason);
    }

    const showDriver = order.driverName && custStatus !== "ยกเลิก" &&
      (custStatus === "จัดหารถแล้ว" || custStatus === "ออกเดินทาง" || custStatus === "ถึงหน้างาน" || custStatus === "จัดส่งสำเร็จ" || isAdmin);

    let driverHtml = '';
    if (showDriver) {
      // แอดมินเปลี่ยนคนขับได้ ตราบใดที่ยังไม่เสร็จ/ยกเลิก
      const canReassign = isAdmin && !["เสร็จงาน", "ยกเลิก"].includes(order.status);
      // งานที่ "วิ่งแล้ว" (คนขับออกเดินทาง+) → ปุ่มเทา + ถามยืนยัน (modal สวย ไม่ใช่ confirm โบราณ) · ยังไม่ออก = ฟ้าปกติ
      const runningStarted = ["เริ่มงานแล้ว", "ถึงลานวางกระบะ", "ถึงลูกค้า", "ออกจากลูกค้า", "ถึงลานขากลับ"].includes(order.status);
      const reBtnCls = runningStarted ? 'bg-gray-200 text-gray-500 hover:bg-gray-300' : 'bg-blue-600 text-white hover:bg-blue-700';
      const reassignBtn = canReassign ? `
        <button onclick="event.stopPropagation(); reassignGuarded('${escapeHtml(order.orderId)}', ${runningStarted})"
          class="flex items-center gap-1 shrink-0 px-2.5 py-1 rounded-lg ${reBtnCls} text-xs font-semibold transition-colors"${runningStarted ? ' title="งานวิ่งแล้ว — เปลี่ยนเฉพาะกรณีจำเป็น"' : ''}>

      const plateBtn = canReassign ? `
        <button onclick="event.stopPropagation(); openPlateEdit('${escapeHtml(order.orderId)}')"

          ${icon("truck", 12)}เปลี่ยนทะเบียน</button>` : '';
      const addJobBtn = canReassign ? `
        <button onclick="event.stopPropagation(); openAddJob('${escapeHtml(order.orderId)}')"
          class="flex items-center gap-1 shrink-0 px-2.5 py-1 rounded-lg bg-fuchsia-600 text-white text-xs font-semibold hover:bg-fuchsia-700 transition-colors">
          ➕ เพิ่มงาน</button>` : '';
      // 🆕 ป้ายรับทราบ — โชว์เฉพาะแอดมิน + งานที่มอบหมายแล้วแต่ยังไม่เริ่ม (status "รับงานแล้ว")
      const showAck = isAdmin && order.status === 'รับงานแล้ว';
      const ackBadge = !showAck ? '' : (order.ackAt
        ? `<span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 whitespace-nowrap" title="${escapeHtml(order.ackAt)}">✅ รับทราบแล้ว</span>`
        : `<span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 whitespace-nowrap">⏳ ยังไม่รับทราบ</span>`);
      driverHtml = `
        <div class="flex items-center justify-between gap-2 text-sm bg-white border border-amber-200 rounded-xl px-3 py-2 text-emerald-900">
          <span>${icon("truck", 14, "inline -mt-0.5 mr-1.5")}คนขับ: ${escapeHtml(order.driverName)} · ทะเบียน ${escapeHtml(order.plate || '')} ${ackBadge}</span>
          <span class="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
            ${order.driverPhone ? `<a href="tel:${escapeHtml(order.driverPhone)}" onclick="event.stopPropagation()" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 transition-colors">${icon("phone", 12)}${escapeHtml(order.driverPhone)}</a>` : ''}
            ${addJobBtn}
            ${reassignBtn}
            ${plateBtn}
          </span>
        </div>`;
    }

    let rampHtml = '';
    if (isAdmin && order.rampInfo) {
      // ปุ่มเบรคแวะลาน: โชว์เมื่อ ยังแวะลานอยู่ (hasRamp) + งานยังไม่จบ/ยกเลิก
      //   + ต้องมีคนขับแล้ว และลานตอบแล้ว (2026-10-08) — เดิมโชว์ตั้งแต่ยังรอลานตอบ กดแล้วออเดอร์ค้าง
      //     (ตั้งผลลาน "ยกเลิกแวะ" แต่ไม่มอบงาน/ไม่กระจาย + ตัวเช็คลานไม่ตอบข้ามไป) — ช่วงรอลานใช้ปุ่มตอบแทนลานเทแทน
      const canBrakeRamp = order.hasRamp && !["เสร็จงาน", "ยกเลิก"].includes(order.status)
        && !!order.driverName && order.rampInfo !== "ยังไม่ตอบ";
      const brakeBtn = canBrakeRamp ? `
        <button onclick="event.stopPropagation(); cancelRampStop('${escapeHtml(order.orderId)}')"
          class="mt-2 flex items-center gap-1 px-2.5 py-1 rounded-lg bg-orange-600 text-white text-xs font-semibold hover:bg-orange-700 transition-colors">
          ⛔ ยกเลิกแวะลาน (ไม่มีปาล์ม)</button>` : '';
      rampHtml = `
        <div class="text-sm bg-white border border-amber-200 rounded-xl px-3 py-2 text-amber-900">
          ${icon("warehouse", 14, "inline -mt-0.5 mr-1.5")}${escapeHtml(order.rampInfo)}
          ${brakeBtn}
        </div>`;
    }

    detailHtml = `
      <div class="px-4 pb-4 border-t border-amber-100 pt-3 space-y-3 bg-amber-50/40">
        ${tlHtml}
        <div class="flex flex-wrap gap-x-6 gap-y-1 text-sm text-emerald-800/80">
          <span><span class="font-medium text-emerald-900">วันที่:</span> ${escapeHtml(fmtDMY(order.date))} ${escapeHtml(order.time || '')}</span>
          ${order.pk ? pkDetailHtml(order.pk) : `<span><span class="font-medium text-emerald-900">จุดรับ:</span> ${escapeHtml(order.pickup || "—")}</span>
          <span><span class="font-medium text-emerald-900">จำนวนกระบะ:</span> ${escapeHtml(String(order.binCount || 1))} ใบ</span>`}
          ${order.billName ? `<span><span class="font-medium text-emerald-900">ชื่อในบิล:</span> ${escapeHtml(order.billName)}</span>` : ""}
        </div>
        ${isAdmin ? pkSlipBoxHtml(order) : ''}
        ${editSectionHtml(order)}
        ${driverHtml}
        ${fleetLineHtml(order)}
        ${rampHtml}
        ${rampApproveHtml(order, isAdmin)}
      </div>`;
  }

  return `
    <div class="bg-white rounded-2xl border border-amber-200 shadow-sm hover:shadow-md transition-shadow overflow-hidden">
      ${barHtml}
      <button onclick="toggleOrder('${escapeHtml(order.orderId)}')" class="w-full flex flex-wrap sm:flex-nowrap items-center justify-between gap-x-3 gap-y-2 p-4 text-left">
        <div class="flex items-center gap-3 min-w-0 flex-1 basis-full sm:basis-auto">
          <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 shrink-0">${icon("package", 20)}</div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="font-semibold text-emerald-900 break-words">${escapeHtml(order.orderId)}</p>
              ${chipHtml}
            </div>
            <p class="text-sm text-amber-700/80 truncate">${escapeHtml(order.gardenName || '')}${order.billName ? ` · ${escapeHtml(order.billName)}` : ""}</p>
          </div>
        </div>
        ${assignDriverHtml}
        <div class="flex items-center gap-2 shrink-0 ml-auto">
          ${pkSlipHtml}
          ${slipChipHtml}
          ${badgeHtml}
          ${icon("chevron", 18, `text-amber-400 transition-transform ${expanded ? "rotate-90" : ""}`)}
        </div>
      </button>
      ${detailHtml}
    </div>`;
}

function toggleOrder(orderId) {
  if (EXPANDED_IDS.has(orderId)) EXPANDED_IDS.delete(orderId);
  else EXPANDED_IDS.add(orderId);
  render();
}

function dashboardHtml(orders, statuses, getKey, cxList) {
  const counts = {};
  statuses.forEach(s => counts[s.key] = 0);
  orders.forEach(o => {
    const k = getKey(o);
    if (counts[k] !== undefined) counts[k]++;
  });
  // ⏳ การ์ดรออนุมัติยกเลิก = นับจาก cxList (ทุกวันที่ของกลุ่มนี้) · มีค้างเกิน 1 ชม. = แดง
  const cxLateN = (cxList || []).filter(cxLate).length;
  if (counts['__cancelwait'] !== undefined) counts['__cancelwait'] = (cxList || []).length;

  const total = orders.length;
  return `<div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 xl:grid-cols-9 gap-3">
    ${statuses.map(s => {
      const active = FILTER_STATUS === s.key;
      const isCx = s.key === '__cancelwait';
      const pct = total > 0 ? Math.round(counts[s.key] / total * 100) : 0;
      const tone = isCx ? (cxLateN ? 'danger' : counts[s.key] ? 'warning' : 'amber') : s.tone;
      return `
        <button onclick="selectStatus('${escapeHtml(s.key)}')" class="text-left rounded-2xl border p-3 transition-all ${renderToneCard(tone)} ${isCx && cxLateN ? 'ring-1 ring-red-400' : ''} ${active ? "ring-2 ring-emerald-500 ring-offset-1" : "hover:shadow-sm"}">
          <div class="flex items-baseline justify-between gap-1">
            <p class="text-2xl font-bold leading-none">${counts[s.key]}</p>
            <span class="text-xs font-bold opacity-50 tabular-nums">${isCx ? 'ทุกวัน' : pct + '%'}</span>
          </div>
          <p class="text-xs font-medium mt-1.5 leading-tight">${escapeHtml(s.label)}</p>
          ${isCx && cxLateN ? `<p class="text-[11px] font-bold mt-1 text-red-700">⚠️ ค้างเกิน ${CX_LATE_H} ชม. ${cxLateN} งาน</p>` : ''}
        </button>`;
    }).join('')}
  </div>`;
}

// งาน Packing นอกช่วงวันที่ที่เลือก (ยังไม่จบ/ไม่ยกเลิก) → [[วันที่, จำนวน], …] เรียงวัน
function pkOtherDays(base) {
  const m = {};
  (base || []).forEach(o => {
    if (o.jobType !== 'Packing' || ['เสร็จงาน', 'ยกเลิก'].includes(o.status) || !o.date || matchesDateFilter(o.date)) return;
    m[o.date] = (m[o.date] || 0) + 1;
  });
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0])).slice(0, 8);
}

function ownerTypeDashboardHtml(orders) {
  const counts = { Owner: 0, Team: 0, Ramp: 0, Admin: 0 };
  orders.forEach(o => { if (counts[o.ownerType] !== undefined) counts[o.ownerType]++; });
  const pkCount = orders.filter(o => o.jobType === 'Packing').length;   // 🆕 นับงาน Packing

  const allActive = FILTER_OWNER_TYPE === null && !FILTER_PACKING;
  let html = `<div class="grid grid-cols-2 sm:grid-cols-6 gap-3">
    <button onclick="selectOwnerType(null)" class="text-left rounded-2xl border border-amber-200 bg-white p-3 transition-all overflow-hidden ${allActive ? "ring-2 ring-emerald-500 ring-offset-1" : "hover:shadow-sm"}">
      <div class="h-1.5 w-full rounded-full mb-2 bg-amber-300"></div>
      <p class="text-2xl font-bold leading-none text-emerald-900">${orders.length}</p>
      <p class="text-xs font-medium mt-1.5 leading-tight text-amber-700/80">ทั้งหมด</p>
    </button>`;

  const totalOwner = orders.length;
  OWNER_TYPE_ORDER.forEach(key => {
    const style = OWNER_TYPE_STYLES[key];
    const active = FILTER_OWNER_TYPE === key && !FILTER_PACKING;
    const pct = totalOwner > 0 ? Math.round(counts[key] / totalOwner * 100) : 0;
    html += `
      <button onclick="selectOwnerType('${key}')" class="text-left rounded-2xl border border-amber-200 bg-white p-3 transition-all overflow-hidden ${active ? "ring-2 ring-emerald-500 ring-offset-1" : "hover:shadow-sm"}">
        <div class="h-1.5 w-full rounded-full mb-2 ${style.bar}"></div>
        <div class="flex items-baseline justify-between gap-1">
          <p class="text-2xl font-bold leading-none text-emerald-900">${counts[key]}</p>
          <span class="text-xs font-bold text-emerald-900/40 tabular-nums">${pct}%</span>
        </div>
        <p class="text-xs font-medium mt-1.5 leading-tight text-amber-700/80">${style.label}</p>
      </button>`;
  });

  // 🆕 การ์ดงาน Packing (ประเภทงาน · สีม่วง-ชมพู ให้ต่างจากผู้สั่ง)
  const pkPct = totalOwner > 0 ? Math.round(pkCount / totalOwner * 100) : 0;
  const pkElse = pkOtherDays(ALL_ORDERS.filter(o => !ADMIN_GROUP || grpOf(o) === ADMIN_GROUP)).reduce((a, x) => a + x[1], 0);
  html += `
    <button onclick="selectPacking()" class="text-left rounded-2xl border p-3 transition-all overflow-hidden ${FILTER_PACKING ? "ring-2 ring-fuchsia-500 ring-offset-1 border-fuchsia-200 bg-fuchsia-50" : "border-fuchsia-200 bg-white hover:shadow-sm"}">
      <div class="h-1.5 w-full rounded-full mb-2 bg-gradient-to-r from-violet-500 to-fuchsia-500"></div>
      <div class="flex items-baseline justify-between gap-1">
        <p class="text-2xl font-bold leading-none text-fuchsia-700">${pkCount}</p>
        <span class="text-xs font-bold text-fuchsia-700/40 tabular-nums">${pkPct}%</span>
      </div>
      <p class="text-xs font-medium mt-1.5 leading-tight text-fuchsia-700/80">📦 งาน Packing</p>
      ${pkElse ? `<p class="text-[10px] font-semibold mt-1 text-fuchsia-600">+ ${pkElse} งานวันอื่น</p>` : ''}
    </button>`;

  html += `</div>`;
  return html;
}

function filterChipsHtml(chips) {
  // 🆕 ชิปเลือกคนขับ (dropdown) — รายชื่อจากออเดอร์ที่มีในช่วงวันที่ที่เลือก
  const drivers = [...new Set(ALL_ORDERS.filter(o => matchesDateFilter(o.date) && (!ADMIN_GROUP || grpOf(o) === ADMIN_GROUP)).map(o => o.driverName).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'th'));
  const drvActive = !!FILTER_DRIVER;
  const drvCls = drvActive ? "bg-emerald-600 border-emerald-600 text-white" : "bg-white border-amber-200 text-emerald-800 hover:bg-amber-50";
  const driverChip = `<select onchange="selectDriver(this.value)" title="กรองตามคนขับ"

    <option value="">👤 คนขับทั้งหมด</option>

  return `<div class="flex flex-wrap gap-2 overflow-x-auto pb-1 scrollbar-thin">

      const active = FILTER_STATUS === c.key;
      const cls = active ? "bg-emerald-600 border-emerald-600 text-white" : "bg-white border-amber-200 text-emerald-800 hover:bg-amber-50";
      return `<button onclick="selectStatus('${escapeHtml(c.key)}')" class="px-3.5 py-1.5 rounded-full text-sm font-medium border transition-colors whitespace-nowrap ${cls}">${escapeHtml(c.label)}</button>`;
    }).join('')}
    ${driverChip}
  </div>`;
}

function selectStatus(key) {
  FILTER_STATUS = (FILTER_STATUS === key) ? "ทั้งหมด" : key;
  render();
}

function selectDriver(name) {
  FILTER_DRIVER = name || null;
  render();
}

function selectOwnerType(key) {
  FILTER_OWNER_TYPE = (FILTER_OWNER_TYPE === key || key === null) ? null : key;
  FILTER_PACKING = false;          // เลือกผู้สั่ง → ล้างตัวกรอง Packing (แถวเดียวเลือกทีละอัน)
  render();
}

function selectPacking() {
  FILTER_PACKING = !FILTER_PACKING;
  if (FILTER_PACKING) FILTER_OWNER_TYPE = null;   // เลือก Packing → ล้างตัวกรองผู้สั่ง
  render();
}

function selectDate(val) {
  FILTER_DATE = (val === 'today') ? todayStr() : val; // '' = ทั้งหมด
  if (DATE_RANGE_MODE && FILTER_DATE_END && FILTER_DATE && FILTER_DATE_END < FILTER_DATE) {
    FILTER_DATE_END = FILTER_DATE;
  }
  render();
}

function selectDateEnd(val) {
  FILTER_DATE_END = val;
  if (FILTER_DATE_END && FILTER_DATE && FILTER_DATE_END < FILTER_DATE) {
    FILTER_DATE = FILTER_DATE_END;
  }
  render();
}

function toggleDateRange() {
  DATE_RANGE_MODE = !DATE_RANGE_MODE;
  if (DATE_RANGE_MODE) {
    if (!FILTER_DATE) FILTER_DATE = todayStr();
    if (!FILTER_DATE_END) FILTER_DATE_END = FILTER_DATE;
  } else {
    FILTER_DATE_END = '';
  }
  render();
}

function dateLabelHtml() {
  if (!FILTER_DATE) return '';
  if (DATE_RANGE_MODE && FILTER_DATE_END && FILTER_DATE_END !== FILTER_DATE) {
    return ` <span class="text-amber-700">· ${formatDateDMY(FILTER_DATE)} – ${formatDateDMY(FILTER_DATE_END)}</span>`;
  }
  const label = (FILTER_DATE === todayStr()) ? 'วันนี้' : formatDateDMY(FILTER_DATE);
  return ` <span class="text-amber-700">· ${escapeHtml(label)}</span>`;
}

// แปลง "yyyy-MM-dd" → "dd-MM-yyyy"
function formatDateDMY(dateStr) {
  if (!dateStr) return '';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return escapeHtml(dateStr);
  const [y, m, d] = parts;
  return `${d}-${m}-${y}`;
}

// ตรวจว่า order.date อยู่ในช่วงที่เลือกหรือไม่
function matchesDateFilter(orderDate) {
  if (!FILTER_DATE) return true;
  if (DATE_RANGE_MODE && FILTER_DATE_END) {
    return orderDate >= FILTER_DATE && orderDate <= FILTER_DATE_END;
  }
  return orderDate === FILTER_DATE;
}

// ====== Main render ======
// 🆕 ชิป Packing — โชว์จำนวนค้างจัดรถ + กดเข้า dashboard (ดีไซน์เด่น: ไล่สีม่วง-ชมพู ต่างจากชิปอื่น)
function packingChipHtml() {
  const has = PK_PENDING != null;
  const n = has ? PK_PENDING : '–';
  const hot = has && PK_PENDING > 0;
  const badge = `<span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full ${hot ? 'bg-white text-fuchsia-700' : 'bg-white/25 text-white'} text-xs font-extrabold">${n}</span>`;
  const inner = `<span class="text-base leading-none">📦</span><span>Packing</span>${badge}<span class="text-white/85 text-xs font-medium">ค้างจัดรถ</span>`;
  const cls = `ml-auto inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-bold text-white shadow-md bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:brightness-110 hover:shadow-lg transition-all ${hot ? 'ring-2 ring-fuchsia-300 ring-offset-1' : ''}`;
  // ส่ง uid แอดมินไปด้วย → แดชบอร์ด Packing รู้ตัวตน (ปุ่ม "สร้างออเดอร์" ใช้งานได้)
  const url = PACKING_URL + (PACKING_URL.indexOf('?') >= 0 ? '&' : '?') + 'uid=' + encodeURIComponent(window._userId || '');
  return PACKING_URL
    ? `<a id="pkchip" href="${escapeHtml(url)}" target="_blank" rel="noopener" class="${cls}" onclick="event.stopPropagation()">${inner}</a>`
    : `<button id="pkchip" type="button" onclick="toast('ยังไม่ได้ตั้ง URL แดชบอร์ด Packing\\nเติมค่า PACKING_URL ใน index.html ก่อนครับ')" class="${cls}">${inner}</button>`;
}

// อัปเดตเฉพาะชิป Packing (หลัง getPkSummary กลับมา) — ไม่ re-render ทั้งหน้า
function refreshPackingChip() {
  const el = document.getElementById('pkchip');
  if (el) el.outerHTML = packingChipHtml();
}

// ── ตำแหน่งรถสด (lazy) — ยิงเบื้องหลังหลังโหลดออเดอร์ · ไม่บล็อกหน้า ──
async function loadFleet() {
  try {
    const res = await fetch(`${GAS_URL}?action=getFleetPositions&userId=${encodeURIComponent(window._userId || '')}`);
    const d = await res.json();
    if (d && d.ok && d.trucks) { FLEET = d.trucks; render(); }
  } catch (e) {}
}

// การ์ดตำแหน่งรถ (เฉพาะออเดอร์ที่กำลังวิ่ง + มีข้อมูล GPS) — วิ่ง/จอด/ดับ + ทิศเข้า/ออก + โลเคชั่น
function fleetLineHtml(order) {
  const inTransit = ["รับงานแล้ว", "เริ่มงานแล้ว", "ถึงลูกค้า"].includes(order.status);
  const plate = String(order.plate || '').split(',')[0].trim();
  if (!inTransit || !plate) return '';
  const t = FLEET[plate];
  if (!t) return '';
  const dot = t.gps === 'run' ? '🟢' : t.gps === 'idling' ? '🟡' : t.gps === 'park' ? '🔴' : '⚫';
  let dir = '';
  if (t.gps === 'run') {
    if (t.direction === 'out') dir = `<span class="text-emerald-700 font-semibold">▶ วิ่งออกไป${t.dirTo ? ' → ' + escapeHtml(t.dirTo) : ''}</span>`;
    else if (t.direction === 'back') dir = `<span class="text-sky-700 font-semibold">◀ วิ่งกลับ${t.dirFrom ? ' จาก ' + escapeHtml(t.dirFrom) : ''}</span>`;
    else dir = `<span class="text-emerald-700 font-semibold">● วิ่งอยู่</span>`;
  }
  const locStr = [t.loc, t.prov].filter(Boolean).map(escapeHtml).join(' ');
  const dist = (t.distFactory != null) ? ` · ห่างโรงงาน ${escapeHtml(String(t.distFactory))} กม.` : '';
  const maps = (t.lat && t.lon) ? ` · <a href="https://www.google.com/maps?q=${t.lat},${t.lon}" target="_blank" rel="noopener" class="text-blue-600 underline">แผนที่</a>` : '';
  return `
    <div class="mt-2 rounded-xl border border-emerald-200 bg-emerald-50/60 px-3 py-2 text-sm text-emerald-900">
      <span class="font-semibold">${dot} รถ ${escapeHtml(plate)}:</span> ${escapeHtml(t.gpsText || '')}${t.speed ? ` (${escapeHtml(String(t.speed))} กม./ชม.)` : ''} ${dir}
      <div class="text-xs text-emerald-800/70 mt-0.5">📍 ${locStr || '—'}${dist} · GPS ${escapeHtml(t.ping || '—')}${maps}</div>
    </div>`;
}

    const otherDays = (isAdmin && FILTER_PACKING) ? pkOtherDays(baseOrders) : [];

  } else {
    orders.forEach((o, idx) => { html += orderCardHtml(o, idx, isAdmin); });

  html += `</div>`;

  html += `

    </div>`;

  document.getElementById('app').innerHTML = html;
  if (isAdmin && typeof ssbGroupChip === 'function') ssbGroupChip(document.getElementById('grpChipT'), ADMIN_GROUP, changeAdminGroup);

function _lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function _lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function init() {
  // 🔧 dev/test override: ?uid=Uxxxx → เข้าดูในฐานะ uid นั้น (ข้าม LINE login) สำหรับแอดมินเทส
  //    ephemeral: ไม่เขียน cache + ล้าง cache เก่าทิ้ง → ครั้งต่อไป (ไม่มี ?uid) ล็อกอินจริงใหม่ ไม่ติดค้าง
  const qUid = new URLSearchParams(location.search).get('uid');
  if (qUid && /^U[0-9a-f]{32}$/i.test(qUid)) {
    try { localStorage.removeItem('ssb_uid'); } catch(e) {}
    window._userId = qUid;
    await loadOrders(false, qUid);
    return;   // ไม่เรียก liff.login() → เปิดในเบราว์เซอร์ปกติได้เลย
  }
  // ⚡ จำ uid เดิม → ยิง getOrderTracker ทันที (ขนานกับ LIFF init) ไม่ต้องรอ LINE เสร็จก่อน
  const cachedUid = _lsGet('ssb_uid');
  let pre = null;
  if (cachedUid) { window._userId = cachedUid; pre = loadOrders(false, cachedUid); }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    window._userId = profile.userId;
    window._profile = profile;   // ชื่อ/รูป ใช้บนหน้าเลือกกลุ่ม (แอดมิน)
    _lsSet('ssb_uid', profile.userId);
    if (pre && cachedUid === profile.userId) { await pre; }   // uid ตรง → ใช้ผลที่โหลดขนานไปแล้ว
    else { await loadOrders(false, profile.userId); }          // uid เปลี่ยน/ไม่มี cache → โหลดด้วย uid จริง
  } catch (e) {
    console.error(e);
    if (!pre) document.getElementById('loading').innerHTML = `<p class="text-sm text-red-600 px-6 text-center">โหลดไม่สำเร็จ: ${escapeHtml(e.message || String(e))}</p>`;
  }
}

async function loadOrders(isRefresh, uid) {
  uid = uid || window._userId;
  LOADING = true;
  spinRefresh(true);   // ปุ่มที่มีอยู่แล้ว → หมุนทันที (บอกว่ากำลังโหลดของสด)

  // 💾 โหลดครั้งแรก + ยังไม่มีข้อมูลบนจอ → โชว์ cache ทันที แล้วค่อยอัปเดตของสด (ปุ่มยังหมุนอยู่เพราะ LOADING=true)
  if (!isRefresh && !ALL_ORDERS.length) {
    try {
      const c = JSON.parse(_lsGet('ssb_orders_' + uid) || 'null');
      if (c && c.orders && c.orders.length) {
        ALL_ORDERS = c.orders; CURRENT_ROLE = c.role || CURRENT_ROLE;
        render();
        document.getElementById('loading').style.display = 'none';
      }
    } catch (e) {}
  }

  try {
    // ⚡ ssbFetch = Supabase Edge "order-tracker" ก่อน (~1 วิ · ผลตรง GAS ทุกฟิลด์) พลาด/เกิน 10 วิ → GAS เดิม
    const res = await (window.ssbFetch || fetch)(`${GAS_URL}?action=getOrderTracker&userId=${uid}`);
    const data = await res.json();

    if (!data.success) {
      if (!ALL_ORDERS.length) document.getElementById('app').innerHTML = `<div class="bg-white rounded-2xl border border-amber-200 p-8 text-center text-amber-700 mt-6">${escapeHtml(data.error || 'เกิดข้อผิดพลาด')}</div>`;
      document.getElementById('loading').style.display = 'none';
      return;
    }

    ALL_ORDERS = data.orders || [];
    CURRENT_ROLE = data.role;
    _lsSet('ssb_orders_' + uid, JSON.stringify({ orders: ALL_ORDERS, role: CURRENT_ROLE, t: Date.now() }));
    LOADING = false;   // ได้ข้อมูลสดแล้ว → render ปุ่มแบบไม่หมุน
    render();
    document.getElementById('loading').style.display = 'none';
    // 🆕 นับคำขอ Packing ค้างจัดรถ — ยิงเบื้องหลัง ไม่บล็อกการแสดงออเดอร์ · เสร็จแล้วอัปเดตเฉพาะชิป
    if (CURRENT_ROLE === 'Admin') {
      (window.ssbFetch || fetch)(`${GAS_URL}?action=getPkSummary`).then(r => r.json()).then(pk => {
        if (pk && pk.ok) { PK_PENDING = pk.waiting; refreshPackingChip(); }
      }).catch(() => {});
      loadFleet();   // ตำแหน่งรถสด (วิ่ง/จอด/ดับ + ทิศ) — เบื้องหลัง เติมบนการ์ดเมื่อได้ข้อมูล
      loadPkSlips(); // 🧾 ใบชั่งออก งาน PK — เบื้องหลัง เติมชิปบนการ์ด
    }
  } catch (e) {
    console.error(e);
    // มีข้อมูล (cache) โชว์อยู่แล้ว → ไม่ต้องทับด้วยหน้า error · แค่เตือนเบาๆ
    if (ALL_ORDERS.length) { toast('อัปเดตข้อมูลไม่สำเร็จ — แสดงข้อมูลล่าสุดที่มี'); }
    else if (!isRefresh) { document.getElementById('loading').innerHTML = `<p class="text-sm text-red-600 px-6 text-center">เชื่อมต่อไม่ได้</p>`; }
  } finally {
    LOADING = false;
    setTimeout(() => spinRefresh(false), 300);   // หยุดหมุน (เผื่อ path ที่ไม่ได้ re-render เช่น error/cache)
  }
}

// ── ตอบแทนลานเท (มีปาล์ม/ไม่มีปาล์ม) จากหน้า tracker ──────────
async function approveRamp(orderId, answer, btn) {
  if (!(await confirmModal({ icon:'🌴', title:'ยืนยันตอบแทนลานเท?', msg:'ตอบ: '+answer, okText:'ยืนยัน' }))) return;
  const wrap = btn.closest('.ramp-approve');
  wrap.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.innerHTML = 'กำลังบันทึก...';

  try {
    const res = await postAction({   // GAS หรือ Edge (เครื่องที่เปิด ?edgew=1)
      action: 'adminApproveRamp',
      orderId: orderId,
      answer:  answer,
      userId:  window._userId
    });
    const data = await res.json();
    if (data && data.success) {
      wrap.innerHTML = `<p class="text-sm font-semibold text-emerald-700 flex items-center gap-1.5">${icon("check", 15)}บันทึก "${escapeHtml(answer)}" และกระจายงานให้คนขับแล้ว</p>`;
      setTimeout(() => loadOrders(true), 1200); // โหลดใหม่ ให้สถานะอัปเดต
    } else {
      toast('ไม่สำเร็จ: ' + ((data && data.error) || 'unknown'));
      render(); // คืนปุ่มกลับ
    }
  } catch (e) {
    toast('เกิดข้อผิดพลาด: ' + (e.message || e));
    render();
  }
}

// ── ตัดสินคำขอยกเลิกของคนขับ (เหมือนหน้าแจ้งเตือนแอดมิน · Edge admin-decide · ?edgew=0 = GAS) ──
async function decideCancelTr(orderId, decision, btn) {
  const ok = decision === 'approve';
  let rejectReason = '';
  if (ok) {
    if (!(await confirmModal({ icon: '🚫', title: 'อนุมัติให้คนขับยกเลิก?',
      msg: orderId + ' — ปลดคนขับออก แล้วกระจายหาคนขับใหม่ทาง LINE', okText: 'อนุมัติยกเลิก', danger: true }))) return;
  } else {   // 11 พ.ย. เหตุผลตอนปฏิเสธ (ไม่บังคับ) → admin-decide ส่งต่อในข้อความถึงคนขับ
    const r = await promptModal({ icon: '🚚', title: 'ปฏิเสธ · ให้คนขับวิ่งต่อ?', msg: orderId + ' — แจ้งคนขับให้ทำงานต่อ',
      placeholder: 'เหตุผลถึงคนขับ (ไม่ใส่ก็ได้)', okText: 'ปฏิเสธ · ให้วิ่งต่อ', cancelText: 'กลับ' });
    if (r === null) return; rejectReason = r;
  }
  const wrap = btn.closest('.cancel-decide');
  wrap.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.innerHTML = 'กำลังบันทึก...';
  try {
    const url = useEdgeWrites() ? 'https://abihhdjcrbvwlkzwvjio.supabase.co/functions/v1/admin-decide' : GAS_URL;
    const res = await fetch(url, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'decideCancel', orderId, decision, rejectReason, userId: window._userId }) });
    const data = await res.json();
    if (data && data.success) {
      wrap.innerHTML = `<p class="text-sm font-semibold text-emerald-700 flex items-center gap-1.5">${icon("check", 15)}${ok ? 'อนุมัติยกเลิกแล้ว · กำลังหาคนขับใหม่' : 'แจ้งคนขับให้วิ่งต่อแล้ว'}</p>`;
      setTimeout(() => loadOrders(true), 1200);
    } else { toast('ไม่สำเร็จ: ' + ((data && data.error) || 'unknown')); render(); }
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + (e.message || e)); render(); }
}

function _renderReassignList(q){
  const list = document.getElementById('reassign-list');
  const cur  = _reassignCtx ? _reassignCtx.driver : '';
  const kw   = (q||'').trim().toLowerCase();
  // ไม่ฝัง JSON ใน onclick (ชื่อไทย/quote พัง) — ส่ง index อ้างกลับไปที่ _reassignDrivers
  list.innerHTML = (_reassignDrivers||[]).map((d, i) => {
    if(kw && !(d.name+' '+d.plate).toLowerCase().includes(kw)) return '';
    const isCur = d.name === cur;
    const busy  = d.status && d.status !== 'ว่าง';
    return `<button ${isCur?'disabled':''} onclick="doReassign(${i})"
      class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border ${isCur?'border-emerald-300 bg-emerald-50 opacity-60 cursor-not-allowed':'border-amber-200 bg-white hover:bg-amber-50'} text-left transition-colors">
      <span class="min-w-0">

    </button>`;
  }).join('') || '<p class="text-sm text-emerald-700 py-6 text-center">ไม่พบคนขับ</p>';

  const list = document.getElementById('reassign-list');

function _plateChoices(){

      <div class="grid grid-cols-2 gap-2">${OT_TYPES.map(([c,n,i])=>`<button onclick="pickOtJob('${c}')" class="text-left px-3 py-2 rounded-xl border text-sm font-semibold transition-colors ${_otPick===c?'bg-emerald-600 border-emerald-600 text-white':'bg-white border-amber-200 text-emerald-900 hover:bg-amber-50'}">${i} ${escapeHtml(n)}</button>`).join('')}</div>
      <p class="text-xs font-semibold text-emerald-800 pt-1">2 · รายละเอียด / ปลายทาง <span class="text-red-600">*</span></p>
      <input id="ot-detail" maxlength="200" value="${escapeHtml(dv)}" placeholder="เช่น ส่งคน 5 คนไปไร่บ่อทอง · เข้าศูนย์ฮีโน่ชลบุรี" class="w-full px-3 py-2 rounded-xl border border-amber-200 text-sm focus:outline-none focus:border-emerald-400">
      <input id="ot-note" maxlength="300" value="${escapeHtml(nv)}" placeholder="หมายเหตุถึงคนขับ (ถ้ามี)" class="w-full px-3 py-2 rounded-xl border border-amber-200 text-sm focus:outline-none focus:border-emerald-400">
      <button onclick="doAddJob('other',0)" class="w-full py-2.5 rounded-xl text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 ${_otPick?'':'opacity-50'}">➕ เพิ่มงานอื่นๆ เข้าทริป</button>`;
    return;
  }
  if(_addJobMode==='packing'){
    if(!_pkWaiting || !_pkWaiting.length){ list.innerHTML = '<p class="text-sm text-emerald-700 py-6 text-center">ไม่มีคำขอ Packing ค้างให้เพิ่ม</p>'; return; }
    list.innerHTML = _pkWaiting.map((q,i)=>`
      <button onclick="doAddJob('packing',${i})" class="w-full text-left px-3 py-2.5 rounded-xl border border-amber-200 bg-white hover:bg-amber-50 transition-colors">
        <span class="block text-sm font-semibold text-emerald-900 truncate">${escapeHtml(q.customer_name||'-')} → ${escapeHtml(q.destination||'-')}</span>
        <span class="block text-xs text-emerald-700/70 truncate">${escapeHtml(q.request_id)} · ${escapeHtml(q.vehicle_type||'')} · ${escapeHtml(q.want_date||'')}</span>
      </button>`).join('');
  }else{
    if(!_rampList || !_rampList.length){ list.innerHTML = '<p class="text-sm text-emerald-700 py-6 text-center">ไม่มีลานในระบบ</p>'; return; }
    list.innerHTML = _rampList.map((r,i)=>`
      <button onclick="doAddJob('ramp',${i})" class="w-full text-left px-3 py-2.5 rounded-xl border border-amber-200 bg-white hover:bg-amber-50 transition-colors">
        <span class="block text-sm font-semibold text-emerald-900 truncate">🌴 ${escapeHtml(r.name||r.code)}</span>
        <span class="block text-xs text-emerald-700/70 truncate">${escapeHtml(r.code)} · รับปาล์มขากลับ</span>
      </button>`).join('');
  }
}
function pickOtJob(c){ _otPick = c; _renderAddJobList(); }
function closeAddJob(){ document.getElementById('addjob-modal').classList.add('hidden'); _addJobCtx=null; }
async function doAddJob(mode, idx){
  if(!_addJobCtx) return;
  let payload, label;
  if(mode==='packing'){ const q=(_pkWaiting||[])[idx]; if(!q) return; payload={source:'packing',requestId:q.request_id}; label=`${q.customer_name} → ${q.destination}`; }
  else if(mode==='other'){
    const t=OT_TYPES.find(x=>x[0]===_otPick); if(!t){ toast('เลือกชนิดงานก่อน'); return; }
    const detail=(document.getElementById('ot-detail').value||'').trim(), note=(document.getElementById('ot-note').value||'').trim();
    if(!detail){ toast('ใส่รายละเอียด/ปลายทางก่อน'); document.getElementById('ot-detail').focus(); return; }
    _otKeep={detail,note}; payload={source:'other',otCode:t[0],detail,note}; label=`${t[2]} ${t[1]} · ${detail}${note?' · 📝 '+note:''}`;
  }
  else { const r=(_rampList||[])[idx]; if(!r) return; payload={source:'ramp',rampCode:r.code,rampName:r.name}; label=`รับปาล์มขากลับ · ${r.name||r.code}`; }
  if(!(await confirmModal({ icon:'➕', title:'เพิ่มงานเข้าทริป?', msg:`งาน: ${label}\nคนขับ: ${_addJobCtx.driver} — จะได้รับงานนี้เพิ่มทันที`, okText:'เพิ่มงาน' }))) return;
  const list = document.getElementById('addjob-list');
  list.innerHTML = '<p class="text-sm text-emerald-700 py-6 text-center">กำลังเพิ่มงาน...</p>';
  try{
    const res = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action:'addJobToTrip', userId: window._userId, baseOrderId: _addJobCtx.orderId}, payload))});
    const txt = await res.text(); let d=null; try{ d=JSON.parse(txt); }catch(_){}
    if(d && d.success){ closeAddJob(); toast(`✅ เพิ่มงาน ${d.orderId} เข้าทริปแล้ว · แจ้งคนขับ ${d.driverName||''} เรียบร้อย`); loadOrders(true); return; }
    if(d && !d.success){ toast('ไม่สำเร็จ: '+(d.error||'unknown')); _renderAddJobList(); return; }
    closeAddJob(); toast('✅ ส่งคำขอเพิ่มงานแล้ว · กำลังรีเฟรช'); setTimeout(()=>loadOrders(true), 1500);
  }catch(e){ toast('ผิดพลาด: '+(e.message||e)); _renderAddJobList(); }
}

init();
</script>

<div id="reassign-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeReassign()">

        <h3 id="reassign-title" class="text-base font-bold text-emerald-900">เปลี่ยนคนขับ</h3>
        <button onclick="closeReassign()" class="text-emerald-700/60 hover:text-emerald-900 text-xl leading-none">&times;</button>
